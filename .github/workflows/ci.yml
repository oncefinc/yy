name: public-contract-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cowagent/requirements.txt
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Compile changed public modules
        run: >-
          python -m compileall -q
          extensions/cow/initiative_engine
          extensions/cow/runtime_paths.py
          cowagent/bridge/optional_hook_health.py
          scripts
          demo/initiative_decision_demo.py
      - name: Run deterministic public contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/extensions:${{ github.workspace }}/cowagent:${{ github.workspace }}/demo
        run: >-
          python -m pytest -q
          extensions/cow/initiative_engine/tests/test_gate.py
          extensions/cow/initiative_engine/tests/test_proactive_receipts.py
          extensions/cow/initiative_engine/tests/test_proactive_policy.py
          extensions/cow/initiative_engine/tests/test_revisit.py
          extensions/cow/initiative_engine/tests/test_curiosity_pool.py
          extensions/cow/initiative_engine/tests/test_curiosity_source_guard.py
          extensions/cow/initiative_engine/tests/test_question_forge_shadow.py
          extensions/cow/initiative_engine/tests/test_loop_control.py
          extensions/cow/initiative_engine/tests/test_behavior_eval.py
          extensions/cow/tests/test_initiative_conversation_continuity.py
          extensions/cow/tests/test_portable_paths.py
          cowagent/tests/test_optional_hook_health.py
          demo/test_initiative_decision_demo.py
      - name: Run synthetic decision demo
        env:
          PYTHONPATH: ${{ github.workspace }}/extensions:${{ github.workspace }}/cowagent:${{ github.workspace }}/demo
        run: python demo/initiative_decision_demo.py --json
      - name: Run proactive behavior contract
        env:
          PYTHONPATH: ${{ github.workspace }}/extensions:${{ github.workspace }}/cowagent
        run: python -m cow.initiative_engine.behavior_eval
